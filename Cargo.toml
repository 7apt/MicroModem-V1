[package]
name = "micromodem"
version = "0.1.0"
edition = "2024"
description = "Detect Android USB tethering interfaces and local proxy endpoints"
license = "MIT"

[[bin]]
name = "micromodem"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
