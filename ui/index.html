<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MicroModem</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">CELLULAR UPLINK DISCOVERY</p>
        <h1>MicroModem</h1>
        <p class="subtitle">Android RNDIS and Wi-Fi proxy detection.</p>
      </div>
      <button id="scan" type="button">Scan networks</button>
    </header>
    <p id="status" class="status" aria-live="polite">Ready to scan.</p>
    <section class="grid">
      <article class="panel">
        <h2>Network interfaces</h2>
        <div id="interfaces" class="empty">Run a scan to inspect available interfaces.</div>
      </article>
      <article class="panel">
        <h2>Proxy endpoints</h2>
        <div id="proxies" class="empty">No scan has run yet.</div>
      </article>
    </section>
    <footer>USB/RNDIS is ranked above Wi-Fi. SOCKS5 results include UDP ASSOCIATE support.</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
